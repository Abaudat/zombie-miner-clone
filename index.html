<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1640">
<title>Purrdozer</title>
<meta name="description" content="Plow through oceans of gems with your bulldozer, crush them into avalanches of gold, and spend it all to get bigger.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="popups"></div>

<div id="hud" hidden>
  <div id="zonePill"></div>
  <button id="muteBtn" aria-label="Sound">
    <svg viewBox="0 0 24 24" class="on"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 24 24" class="off"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</div>
<div id="hint"></div>
<div id="toast"></div>
<div id="banner"></div>
<div id="joy"><div id="knob"></div></div>

<div id="title">
  <div class="title-top">
    <h1><span>PURR</span><span>DOZER</span></h1>
    <p id="tagline"></p>
  </div>
  <div class="title-bottom">
    <button id="playBtn" class="big"></button>
    <button id="newBtn" class="small" hidden></button>
    <div id="langs"></div>
  </div>
</div>

<div id="ending" hidden>
  <div class="card">
    <h2 id="endTitle"></h2>
    <p id="endSub"></p>
    <div class="stats">
      <div><span id="statGems">0</span><label id="lblGems"></label></div>
      <div><span id="statTime">0:00</span><label id="lblTime"></label></div>
    </div>
    <button id="againBtn" class="big"></button>
  </div>
</div>

<div id="loading"><div class="spinner"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
